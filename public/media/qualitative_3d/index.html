<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qualitative Results</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173746;
      --line: #9dcbd2;
      --paper: #edf8f8;
      --panel: #ffffff;
      font-family: "Courier New", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    .wrap { width: min(1920px, 100vw); margin: 0 auto; padding: 18px 28px 26px; }
    .top { display: grid; grid-template-columns: 1fr 0.9fr; gap: 28px; align-items: start; }
    h1 { margin: 0; font-size: clamp(52px, 5.1vw, 96px); line-height: 0.96; letter-spacing: 2px; font-weight: 400; }
    .hint { font-size: clamp(16px, 1.5vw, 28px); line-height: 1.7; color: #6b8790; padding-top: 2px; font-weight: 700; }
    .casebar { margin: 18px 0 14px; width: min(820px, 44vw); border: 2px solid var(--line); background: white; display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; }
    .casebar .label { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
    .casebar .count { font-size: 28px; color: #2b96a8; margin-left: 12px; }
    .navbtn { width: 50px; height: 42px; border: 2px solid var(--line); background: #f7ffff; color: var(--ink); font-size: 30px; font-weight: 900; cursor: pointer; margin-left: 8px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; padding: 0 0 2px; }
    .layout { display: grid; grid-template-columns: 42.5% 57.5%; border: 2px solid var(--line); background: white; min-height: 690px; }
    .left { border-right: 2px solid var(--line); display: grid; grid-template-rows: minmax(450px, 1fr) 190px; min-width: 0; }
    .views8 { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 0; padding: 22px 20px 14px; background: white; }
    .viewcell { display: flex; align-items: center; justify-content: center; border-right: 1.25px dashed rgba(67,94,105,0.25); border-bottom: 1.25px dashed rgba(67,94,105,0.25); min-width: 0; }
    .viewcell:nth-child(4n) { border-right: 0; }
    .viewcell:nth-child(n+5) { border-bottom: 0; }
    .viewcell img { max-width: 98%; max-height: 98%; object-fit: contain; image-rendering: auto; filter: saturate(1.12) contrast(1.08); box-shadow: none; border: 0; outline: 0; background: transparent; }
    .case.case-05 .views8 { padding: 10px 8px 4px; }
    .case.case-05 .viewcell { overflow: visible; }
    .case.case-05 .viewcell img { max-width: 116%; max-height: 116%; transform: scale(1.14); }
    .libarea { border-top: 2px solid var(--line); padding: 9px 12px 10px; background: white; min-width: 0; }
    .libtitle { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 7px; color:var(--ink); font-family:"Courier New",ui-monospace,monospace; }
    .libtitle-main { font-size:11px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .libtitle-count { flex:0 0 auto; padding:4px 7px 3px; border:1px solid rgba(157,203,210,.86); background:#f7ffff; color:#4c7784; font-size:9px; font-weight:900; letter-spacing:.08em; line-height:1; }
    .libstrip { display: flex; gap: 18px; overflow-x: scroll; overflow-y: hidden; height: 166px; padding: 3px 6px 10px; scrollbar-gutter: stable; }
    .libstrip::-webkit-scrollbar { height: 12px; }
    .libstrip::-webkit-scrollbar-track { background: #eaf5f6; border: 1px solid rgba(157,203,210,0.55); }
    .libstrip::-webkit-scrollbar-thumb { background: #83b9c2; border: 2px solid #eaf5f6; border-radius: 999px; }
    .libpart { flex: 0 0 160px; height: 150px; background: linear-gradient(180deg, #ffffff 0%, #fbfdfd 100%); border: 1px solid rgba(157,203,210,0.72); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.85); }
    .results { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, 1fr); }
    .result { position: relative; min-height: 344px; border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); background: white; }
    .result:nth-child(4n) { border-right: 0; }
    .result:nth-child(n+5) { border-bottom: 0; }
    .model-badge { position:absolute; left:12px; top:12px; z-index:2; display:inline-flex; align-items:center; gap:8px; max-width:calc(100% - 24px); padding:6px 7px 5px 9px; border:1px solid rgba(157,203,210,.95); background:rgba(255,255,255,.94); box-shadow:0 3px 12px rgba(41,75,83,.08); backdrop-filter:blur(4px); }
    .tag { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#173746; font-size:10px; font-weight:900; letter-spacing:.055em; line-height:1; }
    .tag::after { display:none; }
    .partcount { flex:0 0 auto; padding:4px 6px 3px; border-left:1px solid rgba(157,203,210,.72); color:#56808c; font-size:9px; font-weight:900; letter-spacing:.05em; line-height:1; }
    .viewer { width: 100%; height: 100%; min-height: inherit; background: white; cursor: grab; }
    .viewer canvas { width: 100%; height: 100%; display: block; }
    .failed { height: 100%; min-height: inherit; display: flex; align-items: center; justify-content: center; text-align: center; font-size: clamp(20px, 1.65vw, 30px); letter-spacing: 3px; font-weight: 900; line-height: 1.25; }
    .case { display: none; }
    .case.active { display: block; }
    @media (max-width: 1100px) {
      .top { grid-template-columns: 1fr; }
      .casebar { width: 100%; }
      .layout { grid-template-columns: 1fr; }
      .left { border-right: 0; border-bottom: 2px solid var(--line); }
      .results { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

    const manifest = {"samples": [{"case_key": "case-01", "case_no": 1, "sample_name": "2129_01871_02497_Robotic_Arm_23ea8dcb", "reference_views": ["reference_views/case-01_v01.png", "reference_views/case-01_v02.png", "reference_views/case-01_v03.png", "reference_views/case-01_v04.png", "reference_views/case-01_v05.png", "reference_views/case-01_v06.png", "reference_views/case-01_v07.png", "reference_views/case-01_v08.png"], "library_parts": [{"library_id": "lib00001", "glb": "models/case-01_lib00001.glb"}, {"library_id": "lib00002", "glb": "models/case-01_lib00002.glb"}, {"library_id": "lib00003", "glb": "models/case-01_lib00003.glb"}, {"library_id": "lib00004", "glb": "models/case-01_lib00004.glb"}, {"library_id": "lib00005", "glb": "models/case-01_lib00005.glb"}, {"library_id": "lib00006", "glb": "models/case-01_lib00006.glb"}, {"library_id": "lib00007", "glb": "models/case-01_lib00007.glb"}], "library_count": 7, "results": {"gt": "models/case-01_ground_truth.glb", "gpt55": "models/case-01_gpt55.glb", "gpt54mini": null, "claude48": "models/case-01_claude48.glb", "gemini31": "models/case-01_gemini31.glb", "gemini25": "models/case-01_gemini25.glb", "qwen37": "models/case-01_qwen37.glb", "qwen35": null}, "part_counts": {"gt": 10, "gpt55": 7, "claude48": 7, "gemini31": 7, "gemini25": 7, "qwen37": 7}}, {"case_key": "case-02", "case_no": 2, "sample_name": "2149_0215_prepared_3824__02541_SR10C_953609b4", "reference_views": ["reference_views/case-02_v01.png", "reference_views/case-02_v02.png", "reference_views/case-02_v03.png", "reference_views/case-02_v04.png", "reference_views/case-02_v05.png", "reference_views/case-02_v06.png", "reference_views/case-02_v07.png", "reference_views/case-02_v08.png"], "library_parts": [{"library_id": "lib00001", "glb": "models/case-02_lib00001.glb"}, {"library_id": "lib00002", "glb": "models/case-02_lib00002.glb"}, {"library_id": "lib00003", "glb": "models/case-02_lib00003.glb"}, {"library_id": "lib00004", "glb": "models/case-02_lib00004. , "reference_views/case-04_v06.png", "reference_views/case-04_v07.png", "reference_views/case-04_v08.png"], "library_parts": [{"library_id": "lib00001", "glb": "models/case-04_lib00001.glb"}, {"library_id": "lib00002", "glb": "models/case-04_lib00002.glb"}, {"library_id": "lib00003", "glb": "models/case-04_lib00003.glb"}, {"library_id": "lib00004", "glb": "models/case-04_lib00004.glb"}, {"library_id": "lib00005", "glb": "models/case-04_lib00005.glb"}, {"library_id": "lib00006", "glb": "models/case-04_lib00006.glb"}, {"library_id": "lib00007", "glb": "models/case-04_lib00007.glb"}, {"library_id": "lib00008", "glb": "models/case-04_lib00008.glb"}, {"library_id": "lib00009", "glb": "models/case-04_lib00009.glb"}, {"library_id": "lib00010", "glb": "models/case-04_lib00010.glb"}, {"library_id": "lib00011", "glb": "models/case-04_lib00011.glb"}], "library_count": 11, "results": {"gt": "models/case-04_ground_truth.glb", "gpt55": null, "gpt54mini": null, "claude48": null, "gemini31": null, "gemini25": null, "qwen37": null, "qwen35": null}, "part_counts": {"gt": 19}}, {"case_key": "case-05", "case_no": 5, "sample_name": "2767_0389_prepared_3824__01763_KX.650_888498ce", "reference_views": ["reference_views/case-05_v01.png", "reference_views/case-05_v02.png", "reference_views/case-05_v03.png", "reference_views/case-05_v04.png", "reference_views/case-05_v05.png", "reference_views/case-05_v06.png", "reference_views/case-05_v07.png", "reference_views/case-05_v08.png"], "library_parts": [{"library_id": "lib00001", "glb": "models/case-05_lib00001.glb"}, {"library_id": "lib00002", "glb": "models/case-05_lib00002.glb"}, {"library_id": "lib00003", "glb": "models/case-05_lib00003.glb"}, {"library_id": "lib00004", "glb": "models/case-05_lib00004.glb"}, {"library_id": "lib00005", "glb": "models/case-05_lib00005.glb"}, {"library_id": "lib00006", "glb": "models/case-05_lib00006.glb"}, {"library_id": "lib00007", "glb": "models/case-05_lib00007.glb"}, {"library_id": "lib00008", "glb": "models/case-05_lib00008.glb"}, {"library_id": "lib00009", "glb": "models/case-05_lib00009.glb"}, {"library_id": "lib00010", "glb": "models/case-05_lib00010.glb"}, {"library_id": "lib00011", "glb": "models/case-05_lib00011.glb"}, {"library_id": "lib00012", "glb": "models/case-05_lib00012.glb"}, {"library_id": "lib00013", "glb": "models/case-05_lib00013.glb"}], "library_count": 13, "results": {"gt": "models/case-05_ground_truth.glb", "gpt55": null, "gpt54mini": null, "claude48": "models/case-05_claude48.glb", "gemini31": null, "gemini25": "models/case-05_gemini25.glb", "qwen37": null, "qwen35": null}, "part_counts": {"gt": 39, "claude48": 26, "gemini25": 13}}]};
    const resultColumns = [["gt", "GROUND TRUTH"], ["gpt55", "GPT 5.5"], ["gpt54mini", "GPT 5.4 MINI"], ["claude48", "CLAUDE OPUS 4.8"], ["gemini31", "GEMINI 3.1 PRO"], ["gemini25", "GEMINI 2.5 FLASH"], ["qwen37", "QWEN 3.7 PLUS"], ["qwen35", "QWEN 3.5 9B"]];
    const loader = new GLTFLoader();
    const initialized = new WeakSet();
    let active = 0;

    function buildCases() {
      const root = document.getElementById('cases');
      root.innerHTML = manifest.samples.map((sample, idx) => `
        <section class="case ${sample.case_key} ${idx === 0 ? 'active' : ''}" data-case="${idx}">
          <div class="layout">
            <aside class="left">
              <div class="views8">
                ${sample.reference_views.map(src => `<div class="viewcell"><img src="${src}" alt=""></div>`).join('')}
              </div>
              <div class="libarea">
                <div class="libtitle"><span class="libtitle-main">LIBRARY PARTS</span><span class="libtitle-count">${sample.library_count} LIBS</span></div>
                <div class="libstrip">
                  ${sample.library_parts.map(part => `<div class="libpart viewer" data-src="${part.glb}?v=qual-layout-hidpi-v1"></div>`).join('')}
                </div>
              </div>
            </aside>
            <section class="results">
              ${resultColumns.map(([key, label]) => {
                const glb = sample.results[key];
                const partCount = sample.part_counts?.[key];
                const countBadge = partCount == null ? '' : `<span class="partcount">${partCount} PARTS</span>`;
                const modelBadge = `<div class="model-badge"><span class="tag">${label}</span>${countBadge}</div>`;
                if (!glb) return `<article class="result">${modelBadge}<div class="failed">NO OUTPUT</div></article>`;
                return `<article class="result">${modelBadge}<div class="viewer" data-src="${glb}?v=qual-layout-hidpi-v1"></div></article>`;
              }).join('')}
            </section>
          </div>
        </section>
      `).join('');
    }

    function fitCamera(camera, controls, object, pad = 1.12) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const fov = camera.fov * Math.PI / 180;
      const distance = Math.abs(maxDim / (2 * Math.tan(fov / 2))) * pad;
      camera.position.set(center.x + distance * 0.95, center.y - distance * 1.05, center.z + distance * 0.92);
      camera.near = Math.max(distance / 1000, 0.01);
      camera.far = distance * 1000;
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.update();
    }

    function averageVertexColor(geometry) {
      const attr = geometry.getAttribute('color');
      if (!attr || attr.count === 0) return new THREE.Color(0.74, 0.74, 0.72);
      let r = 0, g = 0, b = 0;
      for (let i = 0; i < attr.count; i += 1) { r += attr.getX(i); g += attr.getY(i); b += attr.getZ(i); }
      const inv = 1 / attr.count;
      return new THREE.Color(r * inv, g * inv, b * inv);
    }

    function displayColorFor(source) {
      const color = source.clone();
      color.offsetHSL(0, 0.10, 0.045);
      return color;
    }

    const COMPONENT_PALETTE = [
      '#9f9736', '#9d5187', '#ad762f', '#3f8353',
      '#838987', '#3e7793', '#a85e88', '#579262',
      '#9e6530', '#3c6f8c', '#625791', '#aea049'
    ].map(hex => new THREE.Color(hex));

    function componentIndexFromObject(obj, fallbackIndex) {
      const names = [];
      let current = obj;
      while (current) {
        if (current.name) names.push(current.name);
        current = current.parent;
      }
      const joined = names.join(' ');
      const match = joined.match(/(?:^|[^a-z0-9])(?:c|lib)0*(\d+)/i);
      if (!match) return fallbackIndex;
      return Math.max(0, parseInt(match[1], 10) - 1);
    }

    function componentDisplayColor(obj, fallbackIndex) {
      const idx = componentIndexFromObject(obj, fallbackIndex);
      const color = COMPONENT_PALETTE[idx % COMPONENT_PALETTE.length].clone();
      return color;
    }

    function initViewer(el) {
      if (initialized.has(el) || !el.dataset.src) return;
      initialized.add(el);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 4));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.88;
      el.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe8ec, 0.58));
      scene.add(new THREE.AmbientLight(0xffffff, 0.28));
      const key = new THREE.DirectionalLight(0xfff5dd, 1.16);
      key.position.set(2.4, -3.0, 4.8);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xe7f7ff, 0.34);
      fill.position.set(-3.2, 2.0, 2.2);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xffffff, 0.34);
      rim.position.set(-1.8, -2.4, 5.2);
      scene.add(rim);

      const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 100000);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.055;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.8;
      controls.enablePan = true;

      function resize() {
        const rect = el.getBoundingClientRect();
        renderer.setSize(Math.max(1, rect.width), Math.max(1, rect.height), false);
        camera.aspect = Math.max(1, rect.width) / Math.max(1, rect.height);
        camera.updateProjectionMatrix();
      }

      loader.load(el.dataset.src, (gltf) => {
        const model = gltf.scene;
        let meshIndex = 0;
        model.traverse((obj) => {
          if (!obj.isMesh) return;
          if (obj.geometry && obj.geometry.getAttribute('color')) {
            obj.geometry.deleteAttribute('color');
          }
          if (obj.geometry) {
            obj.geometry.computeVertexNormals();
          }
          const displayColor = componentDisplayColor(obj, meshIndex);
          meshIndex += 1;
          obj.material = new THREE.MeshStandardMaterial({
            color: displayColor,
              roughness: 0.56,
              metalness: 0.04,
              envMapIntensity: 0.18,
            emissive: displayColor.clone().multiplyScalar(0.02),
              emissiveIntensity: 0.018,
            vertexColors: false,
            side: THREE.DoubleSide,
            transparent: false,
            opacity: 1.0,
            toneMapped: false
          });
          try {
            const edgeGeom = new THREE.EdgesGeometry(obj.geometry, 78);
            const edgeMat = new THREE.LineBasicMaterial({ color: 0x13222a, transparent: true, opacity: 0.10, depthTest: true, depthWrite: false });
            const edges = new THREE.LineSegments(edgeGeom, edgeMat);
            edges.renderOrder = 2;
            obj.add(edges);
          } catch (err) {}
        });
        scene.add(model);
        resize();
        fitCamera(camera, controls, model, el.classList.contains('libpart') ? 1.08 : 1.40);
      }, undefined, () => {
        el.innerHTML = '<div class="failed">LOAD<br>FAILED</div>';
      });

      const ro = new ResizeObserver(resize);
      ro.observe(el);
      function animate() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();
    }

    function showCase(next) {
      active = (next + manifest.samples.length) % manifest.samples.length;
      document.querySelectorAll('.case').forEach((el, idx) => el.classList.toggle('active', idx === active));
      document.getElementById('caseCount').textContent = `${String(active + 1).padStart(2, '0')} / ${String(manifest.samples.length).padStart(2, '0')}`;
      requestAnimationFrame(() => document.querySelector(`.case[data-case="${active}"]`).querySelectorAll('.viewer').forEach(initViewer));
    }

    buildCases();
    document.getElementById('prevCase').addEventListener('click', () => showCase(active - 1));
    document.getElementById('nextCase').addEventListener('click', () => showCase(active + 1));
    window.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') showCase(active - 1);
      if (event.key === 'ArrowRight') showCase(active + 1);
    });
